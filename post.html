<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A post by Seele / yx." />
  <meta name="theme-color" content="#04070E" />
  <title>Seele / yx — Blog Post</title>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="styles.css" />
  <script src="main.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="subpage">
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-bar">
    <div class="frame bar-inner">
      <a class="brand" href="index.html"><span class="diamond" aria-hidden="true"></span>Seele / yx</a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html">Profile</a>
        <a href="setup.html">Setup</a>
        <a href="gaming.html">Gaming</a>
        <a href="blogs.html" aria-current="page">Blogs</a>
      </nav>
    </div>
  </header>

  <div class="hud" aria-hidden="true">
    <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
  </div>

  <div class="rail fixed" aria-hidden="true">
    <span class="rail-label">Blogs</span>
    <span class="rail-line"></span>
    <span class="rail-ticks"></span>
  </div>

  <main id="main">
    <div class="frame">
      <header class="page-head post-head">
        <div class="head-main">
          <h1 id="post-title">Loading...</h1>
          <div class="post-meta">
            <a class="back" href="blogs.html">← Blogs</a>
            <span id="post-date"></span>
          </div>
        </div>
        <div class="page-meta">
          <span class="k">Section</span><span class="v">04 / 04</span>
        </div>
      </header>
    </div>

    <div class="page-body">
      <div class="frame">
        <div class="body-inner">
          <div class="post-body" id="post-body">
            <p class="blog-loading">Loading post…</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="frame">
      <div class="foot-inner">
        <span>Seele / yx © 2026</span>
        <div class="foot-links">
          <a href="index.html">Profile</a>
          <a href="setup.html">Setup</a>
          <a href="gaming.html">Gaming</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    (() => {
      const titleEl = document.getElementById("post-title");
      const dateEl = document.getElementById("post-date");
      const bodyEl = document.getElementById("post-body");
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");

      const colorMap = {
        blue: "blue",
        ice: "ice",
        gold: "gold",
        dim: "dim",
        pink: "blue",
        "pink-light": "ice",
        teal: "ice",
        white: "ink",
        gray: "dim",
      };

      if (window.marked) {
        marked.use({
          extensions: [
            {
              name: "color",
              level: "inline",
              start(src) {
                return src.match(/:[\w-]+\[/)?.index;
              },
              tokenizer(src) {
                const match = src.match(/^:([\w-]+)\[(.+?)\]/);
                if (!match) return;
                const colorName = match[1];
                if (!colorMap[colorName]) return;
                const text = marked.parseInline(match[2]);
                return { type: "color", raw: match[0], color: colorName, text: text };
              },
              renderer(token) {
                return '<span style="color: var(--' + colorMap[token.color] + ')">' + token.text + "</span>";
              },
            },
            {
              name: "small",
              level: "block",
              start(src) {
                return src.indexOf("-#");
              },
              tokenizer(src) {
                const match = src.match(/^-# (.+?)(?:\n|$)/);
                if (!match) return;
                const text = marked.parseInline(match[1]);
                return { type: "small", raw: match[0], text: text };
              },
              renderer(token) {
                return '<p class="post-small">' + token.text + "</p>";
              },
            },
          ],
        });
      }

      const formatDate = (raw) => {
        const date = new Date(String(raw) + "T00:00:00");
        if (Number.isNaN(date.getTime())) return String(raw || "");
        return new Intl.DateTimeFormat("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        })
          .format(date)
          .toUpperCase();
      };

      const showError = (title, detail) => {
        titleEl.textContent = title;
        document.title = "Seele / yx — " + title;
        dateEl.textContent = "";
        bodyEl.innerHTML =
          '<div class="post-error">' +
          "<p>" +
          detail +
          "</p>" +
          '<a class="row-action" href="blogs.html">Back to blogs <span aria-hidden="true">→</span></a>' +
          "</div>";
      };

      if (!slug) {
        showError("Post not found", "No post specified. Pick one from the archive.");
        return;
      }

      (async () => {
        try {
          const [manifestResponse, mdResponse] = await Promise.all([
            fetch("posts/manifest.json", { cache: "no-cache" }),
            fetch("posts/" + encodeURIComponent(slug) + ".md", { cache: "no-cache" }),
          ]);

          if (!mdResponse.ok) {
            showError(
              "Could not load this post",
              "The archive lists it, but the file is not there yet. Pick another entry or come back later."
            );
            return;
          }

          const manifest = manifestResponse.ok ? await manifestResponse.json() : [];
          const post = Array.isArray(manifest) ? manifest.find((item) => item.slug === slug) : null;
          const markdown = await mdResponse.text();

          if (post) {
            titleEl.textContent = post.title;
            dateEl.textContent = formatDate(post.date);
            document.title = "Seele / yx — " + post.title;
          } else {
            titleEl.textContent = slug;
            document.title = "Seele / yx — " + slug;
          }

          if (window.marked) {
            bodyEl.innerHTML = marked.parse(markdown);
          } else {
            bodyEl.innerHTML = "";
            const pre = document.createElement("pre");
            pre.textContent = markdown;
            bodyEl.appendChild(pre);
          }
        } catch (error) {
          showError(
            "Could not load this post",
            "The archive lists it, but the file is not there yet. Pick another entry or come back later."
          );
        }
      })();
    })();
  </script>
</body>
</html>
